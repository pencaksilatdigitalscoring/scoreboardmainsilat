<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MONITOR - 2 Cahaya Digital Scoring</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap');
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: #f8fafc; 
            color: #1e293b; 
            margin: 0; 
            height: 100vh; 
            width: 100vw; 
            overflow: hidden; /* Mengunci scroll pada body utama */
        }
        
        /* SCROLLBAR CUSTOM */
        .custom-scroll { overflow: hidden; }

        /* COLORS & SHADOWS */
        .sudut-merah-bg { background-color: #ef4444; color: white; }
        .sudut-biru-bg { background-color: #3b82f6; color: white; }
        .leader-glow { box-shadow: 0 0 20px rgba(251, 191, 36, 0.9) !important; border: 4px solid #fbbf24 !important; z-index: 10; transform: scale(1.02); }

        /* HEADER JUDUL MONITOR */
        .mon-kejuaraan-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 10px 20px;
            margin-bottom: 10px;
            width: 100%;
            border-radius: 1rem;
        }
        .mon-logo-side { width: clamp(50px, 8vw, 100px); height: clamp(50px, 8vw, 100px); object-fit: contain; }
        .mon-kejuaraan-title-text { text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .mon-kejuaraan-title-text h1 { font-size: clamp(14px, 2.5vw, 32px); font-weight: 800; color: #1e293b; text-transform: uppercase; line-height: 1.2; margin:0; }
        .mon-kejuaraan-title-text h2 { font-size: clamp(12px, 2vw, 24px); font-weight: 700; color: #10b981; text-transform: uppercase; margin-top: 5px; }

        /* MATCH LIST MONITOR STYLES */
        .mon-match-list-area { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 1rem; padding: 10px; overflow: hidden; height: 100%; }
        .mon-table-header { background: #f1f5f9; color: #1e293b; text-transform: uppercase; font-weight: 900; font-size: 14px; }
        .mon-match-row { border-bottom: 1px solid #f1f5f9; transition: all 0.3s; }
        .mon-match-row:hover { background: #f1f5f9; }
        .mon-cell-blue { background: rgba(59, 130, 246, 0.05); border-left: 4px solid #3b82f6; color: #1e293b; }
        .mon-cell-red { background: rgba(239, 68, 68, 0.05); border-left: 4px solid #ef4444; color: #1e293b; }
        .slot-gray { background-color: #e2e8f0 !important; color: #94a3b8 !important; border-left-color: #cbd5e1 !important; }

        /* AVATAR BOX */
        .avatar-circle { width: clamp(40px, 8vw, 100px); height: clamp(40px, 8vw, 100px); border-radius: 50%; object-fit: cover; border: 3px solid #f1f5f9; background-color: #f1f5f9; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .avatar-mon-table { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 2px solid #e2e8f0; flex-shrink: 0; }

        /* MONITOR CENTER STYLE */
        .mon-center-divider { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: clamp(5px, 1vw, 20px);
            width: clamp(80px, 15vw, 200px);
            flex-shrink: 0;
            height: 100%;
        }

        /* MONITOR PENALTY & ICONS (FILL HEIGHT) */
        .mon-pen-grid-v { display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr); gap: clamp(4px, 1vw, 12px); width: 100%; height: 100%; }
        .mon-pen-icon { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: clamp(18px, 3.5vw, 40px); font-weight: 900; color: #cbd5e1; border: 3px solid #e2e8f0; border-radius: 8px; transition: all 0.3s; }
        .mon-pen-active-b, .mon-pen-active-m { color: #fff !important; background-color: #fbbf24 !important; box-shadow: 0 0 12px #fbbf24; border-color: #fff !important; transform: scale(1.02); }
        
        .mon-card-box { flex: 1; border-radius: clamp(1.5rem, 3vw, 3rem); transition: all 0.3s; overflow: hidden; width: 100%; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; border-bottom-width: clamp(6px, 1.5vw, 15px); border-bottom-color: rgba(0,0,0,0.2); border-bottom-style: solid; margin: 0; }
        .mon-score-val { font-size: clamp(5rem, 18vw, 250px) !important; margin: 0 !important; font-weight: 900 !important; line-height: 1 !important; }
        
        /* DROP BOX (FILL HEIGHT) */
        .mon-dropping-box { background: #f1f5f9; border: 2px solid #e2e8f0; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: clamp(50px, 8vw, 90px); min-height: 0; }
        .mon-dropping-label { font-size: clamp(12px, 2vw, 18px); font-weight: 800; color: #94a3b8; text-transform: uppercase; margin-bottom: 2px; }
        .mon-dropping-val { font-size: clamp(24px, 4vw, 50px); font-weight: 900; color: #0f172a; line-height: 1; }

        /* ANIMASI DROP JATUHAN */
        @keyframes flashDropBg {
            0% { background-color: #fbbf24; border-color: #f59e0b; box-shadow: 0 0 20px rgba(251, 191, 36, 0.8); transform: scale(1.05); }
            50% { background-color: #fbbf24; border-color: #f59e0b; box-shadow: 0 0 20px rgba(251, 191, 36, 0.8); transform: scale(1.05); }
            100% { background-color: #f1f5f9; border-color: #e2e8f0; box-shadow: none; transform: scale(1); }
        }
        .drop-flash {
            animation: flashDropBg 1.5s ease-out forwards;
        }
        .drop-flash .mon-dropping-label, .drop-flash .mon-dropping-val {
            color: white !important;
        }

        /* JURI & TECHNIQUE ICONS BOTTOM BAR */
        .bottom-bar-container { height: clamp(40px, 7vw, 80px); }
        
        .mon-jr-indicator { 
            width: 100%; height: 100%; 
            border-radius: 8px; border: 2px solid #e2e8f0; 
            display: flex; align-items: center; justify-content: center; 
            font-size: clamp(14px, 2.5vw, 24px); font-weight: 900; 
            color: #64748b; background: #f8fafc; transition: all 0.2s; 
        }
        .mon-jr-active { 
            background: #1e293b !important; color: #fff !important; 
            border-color: #fbbf24 !important; box-shadow: 0 0 15px rgba(0,0,0,0.4); 
            transform: scale(1.02); 
        }
        
        .mon-tech-mid-icon { 
            width: 100%; height: 100%; 
            border-radius: 8px; border: 2px solid #e2e8f0; 
            display: flex; align-items: center; justify-content: center; 
            font-size: clamp(18px, 3.5vw, 36px); color: #64748b; background: #f8fafc; transition: all 0.2s; 
        }
        .mon-tech-mid-active { 
            background: #fbbf24 !important; color: #1e293b !important; 
            border-color: #fbbf24 !important; box-shadow: 0 0 15px rgba(251, 191, 36, 0.6); 
            transform: scale(1.02); 
        }

        /* VAR ANIMATION */
        @keyframes varShuffle { 0% { background-color: #3b82f6; } 33% { background-color: #ef4444; } 66% { background-color: #f59e0b; } 100% { background-color: #3b82f6; } }
        .var-shuffle-1 { animation: varShuffle 0.15s infinite; }
        .var-shuffle-2 { animation: varShuffle 0.15s infinite 0.05s; }
        .var-shuffle-3 { animation: varShuffle 0.15s infinite 0.1s; }
        .mon-var-col { width: 100%; height: clamp(30px, 5vw, 60px); border-radius: 8px; border: 2px solid rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; font-size: clamp(12px, 2vw, 20px); font-weight: 900; color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }

        /* ROUND INDICATOR */
        .mon-round-indicator { width: clamp(30px, 5vw, 60px); height: clamp(30px, 5vw, 60px); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: clamp(14px, 2.5vw, 24px); font-weight: 900; transition: all 0.3s; border: 3px solid #e2e8f0; }
        .mon-round-active { background-color: #ef4444 !important; color: white !important; border-color: #ef4444 !important; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); transform: scale(1.15); }
        .mon-round-inactive { background-color: #f1f5f9; color: #cbd5e1; }
    </style>
</head>
<body>

    <!-- SCREEN MONITOR -->
    <div id="screen-monitor" class="p-2 md:p-6 bg-white overflow-hidden h-full w-full flex flex-col">

        <!-- VIEW SCORE LIVE -->
        <div id="mon-view-score-container" class="flex-1 flex flex-col h-full min-h-0 overflow-hidden">
            <div id="mon-scoring-area" class="w-full h-full flex flex-col min-h-0">
                <!-- HTML RENDERED VIA JAVASCRIPT -->
                <div class="flex items-center justify-center h-full">
                    <div class="text-center animate-pulse text-slate-400 font-bold uppercase text-lg md:text-3xl">
                        <i class="fas fa-spinner fa-spin mb-4 text-4xl md:text-6xl"></i><br>
                        Menghubungkan ke Server Scoring...
                    </div>
                </div>
            </div>
        </div>

        <!-- VIEW MATCH LIST (JADWAL) -->
        <div id="mon-view-list-container" class="hidden flex-1 flex flex-col h-full min-h-0 overflow-hidden">
            <div class="mon-match-list-area flex-1 flex flex-col shadow-lg">
                <div class="mb-4 md:mb-8 flex justify-between items-center px-2">
                    <span class="text-slate-800 font-black uppercase italic text-sm md:text-2xl"><i class="fas fa-list text-blue-600 mr-2 md:mr-3"></i> Jadwal Pertandingan</span>
                    <div class="flex gap-2 md:gap-4 items-center">
                        <button onclick="changeMonMatchPage(-1)" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 md:px-6 md:py-3 rounded-xl text-xs md:text-lg font-bold shadow-md transition-all active:scale-95"><i class="fas fa-chevron-left"></i> PREV</button>
                        <span id="mon-match-page-info" class="text-slate-800 font-black text-xs md:text-lg bg-slate-200 px-3 py-2 md:px-6 md:py-3 rounded-xl">Halaman 1</span>
                        <button onclick="changeMonMatchPage(1)" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 md:px-6 md:py-3 rounded-xl text-xs md:text-lg font-bold shadow-md transition-all active:scale-95">NEXT <i class="fas fa-chevron-right"></i></button>
                    </div>
                </div>
                <div class="flex-1 overflow-y-auto overflow-x-hidden custom-scroll">
                    <table class="w-full text-left border-collapse">
                        <thead class="sticky top-0 z-10 shadow-sm">
                            <tr class="mon-table-header">
                                <th class="p-3 md:p-4 border-b border-slate-200" style="width: 5%;">No</th>
                                <th class="p-3 md:p-4 border-b border-slate-200" style="width: 35%;">Info Partai</th>
                                <th class="p-3 md:p-4 border-b border-slate-200" style="width: 25%;">Sudut Biru</th>
                                <th class="p-3 md:p-4 border-b border-slate-200" style="width: 25%;">Sudut Merah</th>
                                <th class="p-3 md:p-4 text-center border-b border-slate-200" style="width: 10%;">Status</th>
                            </tr>
                        </thead>
                        <tbody id="mon-match-list-body" class="text-slate-700 uppercase font-bold text-xs md:text-base"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

<script type="module">
    // FIREBASE INITIALIZATION
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
  apiKey: "AIzaSyB5MREVmz7HIRr6omFHNox2cY6HxSxjqmY",
  authDomain: "rurs-426dc.firebaseapp.com",
  databaseURL: "https://rurs-426dc-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "rurs-426dc",
  storageBucket: "rurs-426dc.firebasestorage.app",
  messagingSenderId: "494291557925",
  appId: "1:494291557925:web:a88203a67c6c2faa1029cc"
};
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const dbRef = ref(database, 'pencak_scoring_state');

    // INITIAL STATE PLACEHOLDER
    window.state = {
        timer: 120, babak: 1, isRunning: false, idx: 0, bertandingIdx: -1, persiapanIdx: -1, monViewMode: 'score',
        matches: Array.from({length: 1000}, (_, i) => ({ p: i+1, m: "", b: "", km: "", kb: "", cat: "", kelas: "", gender: "", fase: "", status: 'idle', totalM: 0, totalB: 0, winner: "", winnerSide: "", photoB: "", photoM: "" })),
        merah: { juri: {j1:[0,0,0], j2:[0,0,0], j3:[0,0,0]}, penHistory: [], jat: 0, jatHistory: [], dis: false, ud: false, wmp: false },
        biru: { juri: {j1:[0,0,0], j2:[0,0,0], j3:[0,0,0]}, penHistory: [], jat: 0, jatHistory: [], dis: false, ud: false, wmp: false },
        var: { active: false, type: '', votes: { j1: '', j2: '', j3: '' } },
        lastHit: { sudut: '', time: 0, multiple: [], type: 0 }
    };
    
    window.monMatchPage = 0;

    // REALTIME LISTENER
    onValue(dbRef, (snapshot) => {
        const data = snapshot.val();
        if (data) { 
            window.state = data; 
            updateUI(); 
            
            if(window.state.monViewMode === 'list') {
                renderMonMatchList();
            }
            switchMonView(window.state.monViewMode || 'score');
        }
    });

    const tStr = (s) => `${Math.floor(s/60).toString().padStart(2,'0')}:${((s||0)%60).toString().padStart(2,'0')}`;

    const calculateTotal = (s) => { 
        const sc = window.state[s]; 
        if(sc.dis || sc.ud || sc.wmp) return 0; 
        const j1T = (sc.juri.j1 || [0,0,0]).reduce((a,b)=>a+b,0), j2T = (sc.juri.j2 || [0,0,0]).reduce((a,b)=>a+b,0), j3T = (sc.juri.j3 || [0,0,0]).reduce((a,b)=>a+b,0); 
        const sorted = [j1T, j2T, j3T].sort((a,b)=>a-b); 
        const tot = sorted[1];
        const pMap = { teguran1:1, teguran2:2, peringatan1:5, peringatan2:10 }; 
        let tp = 0; 
        (sc.penHistory || []).forEach(i => tp += (pMap[i.type]||0)); 
        return (tot || 0) + (sc.jat || 0) - tp; 
    }

    // MAIN UI UPDATER
    window.updateUI = function() {
        const mb = window.state.bertandingIdx >= 0 ? window.state.matches[window.state.bertandingIdx] : window.state.matches[window.state.idx];
        const area = document.getElementById('mon-scoring-area');
        if(!area) return;

        // Display Winner Screen
        if(mb.status === 'selesai' && mb.winnerSide) { 
            const isRed = mb.winnerSide === 'merah'; 
            const isTie = mb.winnerSide === 'tie';
            const overlayClass = isTie ? 'bg-slate-900/70' : (isRed ? 'bg-red-600/70' : 'bg-blue-600/70');
            const textBgClass = isTie ? 'bg-slate-800' : (isRed ? 'sudut-merah-bg' : 'sudut-biru-bg');
            const winName = isTie ? 'KEPUTUSAN DEWAN' : (isRed ? mb.m : mb.b);
            const winKont = isTie ? 'SCORE SERI' : (isRed ? mb.km : mb.kb);
            const winPhoto = isTie ? '' : (isRed ? mb.photoM : mb.photoB);
            const avWin = winPhoto ? `<img src="${winPhoto}" class="w-32 h-32 md:w-64 md:h-64 object-cover rounded-full border-4 md:border-[10px] border-white shadow-2xl mb-4 md:mb-8 z-20 relative">` : '';
            
            // Layout Khusus Saat KEPUTUSAN DEWAN (Seri) - Berada di dalam kotak
            const winNameHtml = isTie 
                ? `<div class="bg-slate-800 border-4 md:border-[8px] border-white/30 px-8 py-4 md:px-16 md:py-8 rounded-[2rem] md:rounded-[3rem] shadow-[0_10px_30px_rgba(0,0,0,0.6)] mb-4 md:mb-8 z-20 relative"><h1 class="text-3xl md:text-7xl font-black uppercase leading-tight m-0 text-white drop-shadow-md">KEPUTUSAN DEWAN</h1></div>` 
                : `<h1 class="text-4xl md:text-9xl font-black uppercase leading-tight mb-2 md:mb-6 truncate w-full px-4 text-white drop-shadow-[0_5px_10px_rgba(0,0,0,0.8)] z-20 relative">${winName}</h1>`;
            
            area.innerHTML = `
            <div class="relative flex-1 rounded-[2rem] md:rounded-[4rem] text-center shadow-2xl flex flex-col items-center justify-center uppercase border-b-[8px] md:border-b-[20px] border-black/20 m-2 md:m-6 min-h-0 overflow-hidden">
                
                <!-- Video Background -->
                <video autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover z-0">
                    <source src="https://github.com/pencaksilatdigitalscoring/BRONZE-DIGITAL-SCORING-PENCAK-SILAT/raw/main/Dua_naga_terbang_menyatu_logo_202608012347.mp4" type="video/mp4">
                </video>
                
                <!-- Color Overlay dengan Blur Halus -->
                <div class="absolute inset-0 ${overlayClass} z-10 backdrop-blur-sm"></div>

                <!-- Konten Utama -->
                <div class="relative z-20 flex flex-col items-center justify-center w-full h-full p-6 md:p-16 animate-pulse">
                    <div class="bg-black/50 backdrop-blur-md px-6 py-2 md:px-10 md:py-4 rounded-full shadow-2xl mb-4 md:mb-8 border border-white/20">
                        <p class="text-sm md:text-3xl font-black uppercase tracking-widest text-white m-0">PEMENANG PARTAI ${mb.p} - ${mb.kelas} ${mb.fase} ${mb.cat} ${mb.gender}</p>
                    </div>
                    
                    ${avWin}
                    
                    ${winNameHtml}
                    
                    <div class="${textBgClass} px-8 py-3 md:px-12 md:py-5 rounded-2xl md:rounded-3xl truncate max-w-[90%] shadow-[0_10px_30px_rgba(0,0,0,0.5)] border-2 border-white/30 z-20 relative">
                        <h2 class="text-lg md:text-5xl font-bold uppercase text-white m-0">${winKont}</h2>
                    </div>
                </div>
            </div>`; 
            return; 
        }

        let tm = calculateTotal('merah'), tb = calculateTotal('biru');
        let threshold = 30; 
        const currentCat = (mb.cat || "").toUpperCase();
        if(currentCat.includes("USIA DINI") || currentCat.includes("PRA REMAJA")) { threshold = 20; }
        let autoWmpB = false, autoWmpM = false;
        const pointDiff = Math.abs(tm - tb);
        if (pointDiff >= threshold) { if (tm > tb) autoWmpB = true; else if (tb > tm) autoWmpM = true; }
        
        const glowB = (typeof tb === 'number' && typeof tm === 'number') ? (tb > tm ? 'leader-glow' : '') : '';
        const glowM = (typeof tm === 'number' && typeof tb === 'number') ? (tm > tb ? 'leader-glow' : '') : '';

        const valB = window.state.biru.dis ? "DISK" : window.state.biru.ud ? "UD" : (window.state.biru.wmp || autoWmpB) ? "WMP" : tb;
        const valM = window.state.merah.dis ? "DISK" : window.state.merah.ud ? "UD" : (window.state.merah.wmp || autoWmpM) ? "WMP" : tm;
        
        let monDisplayB = valB; let monDisplayM = valM;
        let monBgB = "sudut-biru-bg"; let monBgM = "sudut-merah-bg";
        let monFontSizeB = "mon-score-val"; let monFontSizeM = "mon-score-val";
        
        // Membungkus WMP, DISK, UD ke dalam kotak UI
        if (["WMP", "DISK", "UD"].includes(valB)) {
            monDisplayB = `<div class="bg-black/40 border-4 border-white/50 px-6 py-2 md:px-10 md:py-4 rounded-[1.5rem] md:rounded-[2.5rem] inline-flex items-center justify-center shadow-2xl backdrop-blur-sm transform transition-all duration-300 hover:scale-105"><span class="text-white drop-shadow-lg tracking-widest">${valB}</span></div>`;
            monFontSizeB = 'text-5xl md:text-[6rem] font-black';
        } else if (typeof valB === 'string' && valB.length > 3 && !window.state.var.active) {
            monFontSizeB = 'text-xl md:text-6xl font-black';
        }

        if (["WMP", "DISK", "UD"].includes(valM)) {
            monDisplayM = `<div class="bg-black/40 border-4 border-white/50 px-6 py-2 md:px-10 md:py-4 rounded-[1.5rem] md:rounded-[2.5rem] inline-flex items-center justify-center shadow-2xl backdrop-blur-sm transform transition-all duration-300 hover:scale-105"><span class="text-white drop-shadow-lg tracking-widest">${valM}</span></div>`;
            monFontSizeM = 'text-5xl md:text-[6rem] font-black';
        } else if (typeof valM === 'string' && valM.length > 3 && !window.state.var.active) {
            monFontSizeM = 'text-xl md:text-6xl font-black';
        }

        let varIndicatorHtml = "";

        // Tampilan VAR override default view
        if (window.state.var && window.state.var.active) {
            const vType = window.state.var.type; 
            const votes = window.state.var.votes;
            const vArr = [votes.j1, votes.j2, votes.j3].filter(x => x !== '');
            
            monDisplayB = `VERIFIKASI ${vType}`; monDisplayM = `VERIFIKASI ${vType}`;
            monFontSizeB = "text-base md:text-4xl font-black"; monFontSizeM = "text-base md:text-4xl font-black";
            monBgB = "bg-yellow-500 !text-slate-900"; monBgM = "bg-yellow-500 !text-slate-900";
            
            let boxes = [];
            for(let i=1; i<=3; i++) {
                const v = votes['j'+i];
                if(vArr.length < 3) { 
                    boxes.push(`<div class="mon-var-col var-shuffle-${i} uppercase">JURI ${i}</div>`); 
                } else { 
                    const bgCol = v === 'biru' ? 'bg-blue-600' : (v === 'merah' ? 'bg-red-600' : 'bg-yellow-500'); 
                    boxes.push(`<div class="mon-var-col ${bgCol} uppercase">JURI ${i}</div>`); 
                }
            }
            varIndicatorHtml = `<div class="absolute inset-x-0 top-0 p-2 md:p-4 flex gap-2 md:gap-4 z-10">${boxes.join('')}</div>`;
            
            if (vArr.length === 3) {
                const count = { biru: 0, merah: 0, kuning: 0 }; 
                vArr.forEach(v => { if(count[v] !== undefined) count[v]++; });
                if (count.biru >= 2) { monDisplayB = "VALID"; monDisplayM = "VALID"; monFontSizeB = "text-xl md:text-6xl font-black"; monFontSizeM = "text-xl md:text-6xl font-black"; monBgB = "sudut-biru-bg"; monBgM = "sudut-biru-bg"; }
                else if (count.merah >= 2) { monDisplayB = "VALID"; monDisplayM = "VALID"; monFontSizeB = "text-xl md:text-6xl font-black"; monFontSizeM = "text-xl md:text-6xl font-black"; monBgB = "sudut-merah-bg"; monBgM = "sudut-merah-bg"; }
                else if (count.kuning >= 2) { monDisplayB = "INVALID"; monDisplayM = "INVALID"; monFontSizeB = "text-xl md:text-6xl font-black"; monFontSizeM = "text-xl md:text-6xl font-black"; monBgB = "bg-yellow-500 !text-slate-900"; monBgM = "bg-yellow-500 !text-slate-900"; }
            }
        }

        const avB = mb.photoB ? `<img src="${mb.photoB}" class="avatar-circle">` : `<div class="avatar-circle flex items-center justify-center text-slate-300 bg-white shadow-sm"><i class="fas fa-user text-2xl md:text-5xl"></i></div>`;
        const avM = mb.photoM ? `<img src="${mb.photoM}" class="avatar-circle">` : `<div class="avatar-circle flex items-center justify-center text-slate-300 bg-white shadow-sm"><i class="fas fa-user text-2xl md:text-5xl"></i></div>`;
        
        const curJatB = (window.state.biru.jatHistory || []).filter(j => j.round === window.state.babak).length;
        const curJatM = (window.state.merah.jatHistory || []).filter(j => j.round === window.state.babak).length;
        
        // Logika Responsif Flash Saat Jatuhan Bertambah
        if (typeof window.prevJatB === 'undefined') window.prevJatB = curJatB;
        if (typeof window.prevJatM === 'undefined') window.prevJatM = curJatM;
        if (curJatB > window.prevJatB) { window.lastJatTimeB = Date.now(); setTimeout(updateUI, 1500); }
        if (curJatM > window.prevJatM) { window.lastJatTimeM = Date.now(); setTimeout(updateUI, 1500); }
        window.prevJatB = curJatB;
        window.prevJatM = curJatM;

        const flashB = (window.lastJatTimeB && (Date.now() - window.lastJatTimeB < 1500)) ? 'drop-flash' : '';
        const flashM = (window.lastJatTimeM && (Date.now() - window.lastJatTimeM < 1500)) ? 'drop-flash' : '';

        const matchDesc = `Partai ${mb.p} / ${mb.fase} / ${mb.kelas} ${mb.cat} ${mb.gender}`.toUpperCase();

        area.innerHTML = `
        <div class="mon-kejuaraan-header shadow-sm border border-slate-200">
            <img src="https://iili.io/n85iGPn.jpg" class="mon-logo-side">
            <div class="mon-kejuaraan-title-text">
                <h1>MAIN SILAT TANGERANG</h1>
                <h2>ADMIN - 082244942026</h2>
            </div>
            <img src="https://iili.io/CZgpAb4.jpg" class="mon-logo-side">
        </div>
        
        <div id="mon-match-info-header" class="w-full bg-slate-900 text-white py-2 px-4 rounded-xl text-center font-bold uppercase tracking-widest text-xs md:text-xl mb-4 shadow-md italic">
            ${matchDesc}
        </div>

        <div class="flex gap-2 md:gap-6 flex-1 min-h-0 w-full mt-2">
            
            <!-- BIRU SIDE -->
            <div class="flex flex-col flex-1 h-full min-w-0 uppercase">
                <!-- Header Avatar/Nama -->
                <div class="flex items-center gap-2 md:gap-4 w-full mb-2 px-2">
                    ${avB}
                    <div class="overflow-hidden flex-1 min-w-0">
                        <p class="text-sm md:text-4xl font-black truncate text-slate-800 leading-tight">${mb.b||'BIRU'}</p>
                        <p class="text-[10px] md:text-xl font-bold text-blue-600 italic truncate bg-blue-50 inline-block px-2 py-1 rounded mt-1">${mb.kb||'---'}</p>
                    </div>
                </div>
                <!-- Box Content (Drop+Pen & Score) -->
                <div class="flex flex-1 gap-2 md:gap-4 min-h-0">
                    <div class="flex flex-col w-[25%] max-w-[150px] gap-2 md:gap-4 h-full">
                        <!-- Indikator Drop Biru dengan Flash Kuning -->
                        <div class="mon-dropping-box shadow-md flex-1 ${flashB}">
                            <span class="mon-dropping-label flex items-center justify-center gap-1"><i class="fas fa-arrow-circle-down"></i> DROP</span>
                            <span class="mon-dropping-val">${curJatB}</span>
                        </div>
                        <div class="mon-pen-grid-v flex-[2]">
                            <div id="mon-pen-b-binaan1" class="mon-pen-icon bg-white"><i class="fas fa-hand-point-left"></i></div>
                            <div id="mon-pen-b-binaan2" class="mon-pen-icon bg-white"><i class="fas fa-hand-peace rotate-90"></i></div>
                            <div id="mon-pen-b-teguran1" class="mon-pen-icon bg-white"><i class="fas fa-hand-point-up"></i></div>
                            <div id="mon-pen-b-teguran2" class="mon-pen-icon bg-white"><i class="fas fa-hand-peace"></i></div>
                            <div id="mon-pen-b-peringatan1" class="mon-pen-icon bg-white">1</div>
                            <div id="mon-pen-b-peringatan2" class="mon-pen-icon bg-white">2</div>
                        </div>
                    </div>
                    <div id="mon-box-b" class="${monBgB} p-2 md:p-6 text-center shadow-xl transition-all mon-card-box ${glowB} flex-1 relative flex flex-col justify-center h-full w-full">
                        ${varIndicatorHtml}
                        <h2 class="${monFontSizeB} z-10">${monDisplayB}</h2>
                    </div>
                </div>
            </div>

            <!-- CENTER DIVIDER -->
            <div class="mon-center-divider shrink-0 uppercase">
                <div class="font-black text-slate-800 font-mono mb-2 leading-none" style="font-size: clamp(30px, 6vw, 70px);" id="mon-timer-disp">${tStr(window.state.timer)}</div>
                <div class="flex flex-col gap-2 mt-2 items-center">
                    <div class="mon-round-indicator ${window.state.babak === 1 ? 'mon-round-active' : 'mon-round-inactive'} shadow-md">I</div>
                    <div class="mon-round-indicator ${window.state.babak === 2 ? 'mon-round-active' : 'mon-round-inactive'} shadow-md">II</div>
                    <div class="mon-round-indicator ${window.state.babak === 3 ? 'mon-round-active' : 'mon-round-inactive'} shadow-md">III</div>
                    <span class="text-[10px] md:text-sm font-black text-slate-500 mt-2 tracking-widest">ROUND</span>
                </div>
            </div>

            <!-- MERAH SIDE -->
            <div class="flex flex-col flex-1 h-full min-w-0 uppercase">
                <!-- Header Avatar/Nama -->
                <div class="flex items-center justify-end gap-2 md:gap-4 w-full mb-2 px-2">
                    <div class="overflow-hidden text-right flex-1 min-w-0">
                        <p class="text-sm md:text-4xl font-black truncate text-slate-800 leading-tight">${mb.m||'MERAH'}</p>
                        <p class="text-[10px] md:text-xl font-bold text-red-600 italic truncate bg-red-50 inline-block px-2 py-1 rounded mt-1">${mb.km||'---'}</p>
                    </div>
                    ${avM}
                </div>
                <!-- Box Content (Score & Drop+Pen) -->
                <div class="flex flex-1 gap-2 md:gap-4 min-h-0">
                    <div id="mon-box-m" class="${monBgM} p-2 md:p-6 text-center shadow-xl transition-all mon-card-box ${glowM} flex-1 relative flex flex-col justify-center h-full w-full">
                        ${varIndicatorHtml}
                        <h2 class="${monFontSizeM} z-10">${monDisplayM}</h2>
                    </div>
                    <div class="flex flex-col w-[25%] max-w-[150px] gap-2 md:gap-4 h-full">
                        <!-- Indikator Drop Merah dengan Flash Kuning -->
                        <div class="mon-dropping-box shadow-md flex-1 ${flashM}">
                            <span class="mon-dropping-label flex items-center justify-center gap-1"><i class="fas fa-arrow-circle-down"></i> DROP</span>
                            <span class="mon-dropping-val">${curJatM}</span>
                        </div>
                        <div class="mon-pen-grid-v flex-[2]">
                            <div id="mon-pen-m-binaan1" class="mon-pen-icon bg-white"><i class="fas fa-hand-point-right"></i></div>
                            <div id="mon-pen-m-binaan2" class="mon-pen-icon bg-white"><i class="fas fa-hand-peace rotate-90"></i></div>
                            <div id="mon-pen-m-teguran1" class="mon-pen-icon bg-white"><i class="fas fa-hand-point-up"></i></div>
                            <div id="mon-pen-m-teguran2" class="mon-pen-icon bg-white"><i class="fas fa-hand-peace"></i></div>
                            <div id="mon-pen-m-peringatan1" class="mon-pen-icon bg-white">1</div>
                            <div id="mon-pen-m-peringatan2" class="mon-pen-icon bg-white">2</div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- JURI & ICONS BOTTOM BAR (DARI UJUNG KE UJUNG) -->
        <div class="grid grid-cols-8 gap-2 md:gap-4 w-full mt-2 md:mt-4 shrink-0 bottom-bar-container pb-1">
            <div id="mon-b-j1" class="mon-jr-indicator shadow-sm">J1</div>
            <div id="mon-b-j2" class="mon-jr-indicator shadow-sm">J2</div>
            <div id="mon-b-j3" class="mon-jr-indicator shadow-sm">J3</div>
            
            <div id="mon-mid-puk" class="mon-tech-mid-icon shadow-sm"><i class="fas fa-hand-fist"></i></div>
            <div id="mon-mid-ten" class="mon-tech-mid-icon shadow-sm"><i class="fas fa-shoe-prints -rotate-90"></i></div>
            
            <div id="mon-m-j1" class="mon-jr-indicator shadow-sm">J1</div>
            <div id="mon-m-j2" class="mon-jr-indicator shadow-sm">J2</div>
            <div id="mon-m-j3" class="mon-jr-indicator shadow-sm">J3</div>
        </div>
        `; 

        ['biru', 'merah'].forEach(s => { 
            const sPre = s === 'biru' ? 'b-' : 'm-'; 
            const hist = window.state[s].penHistory || []; 
            const last = window.state.lastHit || { time: 0, multiple: [], type: 0 }; 
            const isAct = (last.sudut === s && (Date.now() - last.time < 700)); 
            
            [1,2,3].forEach(j => { 
                const jAct = (isAct && last.multiple.includes('j'+j)); 
                const el = document.getElementById('mon-'+sPre+'j'+j); 
                if(el) el.classList.toggle('mon-jr-active', jAct); 
            }); 
            
            ['binaan1', 'binaan2', 'teguran1', 'teguran2', 'peringatan1', 'peringatan2'].forEach(p => { 
                const act = p.startsWith('peringatan') ? hist.some(x => x.type === p) : hist.some(x => x.type === p && x.round === window.state.babak); 
                const el = document.getElementById(`mon-pen-${sPre}${p}`); 
                if(el) { 
                    if(s==='biru') el.classList.toggle('mon-pen-active-b', act); 
                    else el.classList.toggle('mon-pen-active-m', act); 
                } 
            }); 
        });

        const lastH = window.state.lastHit || { time: 0, type: 0 };
        const isRecent = (Date.now() - lastH.time < 700);
        const midPuk = document.getElementById('mon-mid-puk'); 
        const midTen = document.getElementById('mon-mid-ten');
        if(midPuk) midPuk.classList.toggle('mon-tech-mid-active', isRecent && lastH.type === 1);
        if(midTen) midTen.classList.toggle('mon-tech-mid-active', isRecent && lastH.type === 2);
    }

    window.switchMonView = function(mode) {
        const scoreContainer = document.getElementById('mon-view-score-container');
        const listContainer = document.getElementById('mon-view-list-container');
        if(mode === 'score') {
            scoreContainer.classList.remove('hidden');
            listContainer.classList.add('hidden');
        } else {
            scoreContainer.classList.add('hidden');
            listContainer.classList.remove('hidden');
        }
    }

    window.renderMonMatchList = function() {
        const body = document.getElementById('mon-match-list-body');
        if(!body) return;
        const list = window.state.matches.filter(m => m.m || m.b);
        const start = window.monMatchPage * 10;
        const pageItems = list.slice(start, start + 10);
        const bIdx = window.state.bertandingIdx;
        
        body.innerHTML = pageItems.map((m, i) => {
            const realIdx = m.p - 1;
            const isBertanding = (realIdx === bIdx);
            const isPersiapan = (realIdx > bIdx && realIdx <= bIdx + 3);
            const isSelesai = m.status === 'selesai';
            
            let statusLabel = '';
            if(isBertanding) { statusLabel = '<span class="text-emerald-600 font-black bg-emerald-100 px-3 py-2 md:px-5 md:py-3 rounded-xl shadow-sm">LIVE</span>'; }
            else if(isPersiapan) { statusLabel = '<span class="text-amber-600 font-black bg-amber-100 px-3 py-2 md:px-5 md:py-3 rounded-xl shadow-sm">SIAP</span>'; }
            else if(isSelesai) { statusLabel = `<span class="bg-slate-800 px-3 py-2 md:px-5 md:py-3 rounded-xl text-white font-black shadow-sm">${m.totalB} - ${m.totalM}</span>`; }
            else { statusLabel = '<span class="text-slate-400">WAIT</span>'; }
            
            const bGray = (isSelesai && m.winnerSide === 'merah') ? 'slot-gray' : '';
            const mGray = (isSelesai && m.winnerSide === 'biru') ? 'slot-gray' : '';
            
            const avB = m.photoB ? `<img src="${m.photoB}" class="avatar-mon-table">` : `<div class="avatar-mon-table bg-slate-100 flex items-center justify-center"><i class="fas fa-user text-xs md:text-base text-slate-300"></i></div>`;
            const avM = m.photoM ? `<img src="${m.photoM}" class="avatar-mon-table">` : `<div class="avatar-mon-table bg-slate-100 flex items-center justify-center"><i class="fas fa-user text-xs md:text-base text-slate-300"></i></div>`;
            
            return `
            <tr class="mon-match-row">
                <td class="p-3 md:p-4 border-r border-slate-100 text-center font-black">${m.p}</td>
                <td class="p-3 md:p-4 border-r border-slate-100 leading-tight">
                    <div class="text-emerald-600 font-black uppercase mb-1 md:mb-2 text-sm md:text-lg"><i class="fas fa-trophy mr-2"></i> Partai ${m.p}</div>
                    <div class="text-slate-800 text-xs md:text-sm">${m.fase} - ${m.kelas} ${m.cat} ${m.gender}</div>
                </td>
                <td class="p-3 md:p-4 mon-cell-blue border-r border-slate-100 ${bGray}">
                    <div class="flex items-center gap-2 md:gap-4">
                        ${avB}
                        <div class="overflow-hidden">
                            <div class="${bGray ? 'text-slate-400' : 'text-slate-800'} truncate font-black text-sm md:text-lg">${m.b}</div>
                            <div class="text-[10px] md:text-xs ${bGray ? 'text-slate-500' : 'text-slate-500'} truncate font-bold mt-1">${m.kb}</div>
                        </div>
                    </div>
                </td>
                <td class="p-3 md:p-4 mon-cell-red border-r border-slate-100 ${mGray}">
                    <div class="flex items-center gap-2 md:gap-4">
                        ${avM}
                        <div class="overflow-hidden">
                            <div class="${mGray ? 'text-slate-400' : 'text-slate-800'} truncate font-black text-sm md:text-lg">${m.m}</div>
                            <div class="text-[10px] md:text-xs ${mGray ? 'text-slate-500' : 'text-slate-500'} truncate font-bold mt-1">${m.km}</div>
                        </div>
                    </div>
                </td>
                <td class="p-3 md:p-4 text-center">
                    <div class="flex items-center justify-center">${statusLabel}</div>
                </td>
            </tr>`;
        }).join('');
        document.getElementById('mon-match-page-info').innerText = `Halaman ${window.monMatchPage + 1}`;
    }

    window.changeMonMatchPage = function(v) {
        const total = window.state.matches.filter(m => m.m || m.b).length;
        const max = Math.max(0, Math.ceil(total/10)-1);
        let n = window.monMatchPage + v;
        if(n >= 0 && n <= max) { window.monMatchPage = n; renderMonMatchList(); }
    }
</script>
</body>
</html>
